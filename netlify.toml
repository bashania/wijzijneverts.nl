# Netlify-configuratie voor de Everts-website (statische site, geen build-stap)
[build]
  publish = "."

# Oud domein: behoud het pad bij de permanente verhuizing.
[[redirects]]
  from = "http://www.evertsgroep.nl/*"
  to = "https://www.wijzijneverts.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.evertsgroep.nl/*"
  to = "https://www.wijzijneverts.nl/:splat"
  status = 301
  force = true

# Oude conceptlinks (oktober 2026) naar de definitieve pagina's.
[[redirects]]
  from = "/concept/2026-10-diensten/*"
  to = "/wat-we-doen/"
  status = 301

# Nette beveiligingsheaders
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
